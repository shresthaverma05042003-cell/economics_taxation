function loadQuiz() {
    const form = document.getElementById("quizForm");
    let html = "";
    
    masterQuestions.forEach((item, index) => {
        html += `<div class="question" id="q-block-${index}">`;
        html += `<p>Q${index + 1}. ${item.q}</p>`;
        html += `<div class="options" id="options-${index}">`;
        
        item.options.forEach(opt => {
            html += `<label id="label-${index}-${CSS.escape(opt)}"><input type="radio" name="q${index}" value="${opt}" onchange="checkInstant(${index}, '${opt.replace(/'/g, "\\'")}')"> ${opt}</label>`;
        });
        
        html += `</div>`;
        html += `<div class="instant-feedback" id="feedback-${index}"></div>`;
        html += `</div>`;
    });
    
    form.innerHTML = html;
}

function checkInstant(index, selectedOpt) {
    const item = masterQuestions[index];
    const feedbackDiv = document.getElementById(`feedback-${index}`);
    
    // Clear previous highlights for this question options
    item.options.forEach(opt => {
        const lbl = document.getElementById(`label-${index}-${CSS.escape(opt)}`);
        if (lbl) {
            lbl.classList.remove("correct-option", "wrong-option");
        }
    });

    const selectedLbl = document.getElementById(`label-${index}-${CSS.escape(selectedOpt)}`);
    
    if (selectedOpt === item.answer) {
        if (selectedLbl) selectedLbl.classList.add("correct-option");
        feedbackDiv.innerHTML = `<span class="correct">✔ Correct!</span>`;
    } else {
        if (selectedLbl) selectedLbl.classList.add("wrong-option");
        feedbackDiv.innerHTML = `<span class="wrong">✖ Wrong!</span>`;
    }
}

function submitQuiz() {
    let score = 0;
    let attempted = 0;
    
    masterQuestions.forEach((item, index) => {
        const radios = document.getElementsByName(`q${index}`);
        let selectedVal = null;
        
        for (let r of radios) {
            if (r.checked) {
                selectedVal = r.value;
                break;
            }
        }
        
        const feedbackDiv = document.getElementById(`feedback-${index}`);
        
        // Clear options styling first
        item.options.forEach(opt => {
            const lbl = document.getElementById(`label-${index}-${CSS.escape(opt)}`);
            if (lbl) {
                lbl.classList.remove("correct-option", "wrong-option");
            }
        });

        // Highlight correct option for all questions upon submission
        const correctLbl = document.getElementById(`label-${index}-${CSS.escape(item.answer)}`);
        if (correctLbl) {
            correctLbl.classList.add("correct-option");
        }
        
        if (selectedVal !== null) {
            attempted++;
            if (selectedVal === item.answer) {
                score++;
                feedbackDiv.innerHTML = `<span class="correct">✔ Correct!</span>`;
            } else {
                const wrongLbl = document.getElementById(`label-${index}-${CSS.escape(selectedVal)}`);
                if (wrongLbl) {
                    wrongLbl.classList.add("wrong-option");
                }
                feedbackDiv.innerHTML = `<span class="wrong">✖ Wrong! Correct answer: ${item.answer}</span>`;
            }
        } else {
            feedbackDiv.innerHTML = `<span class="wrong">⚠ Not attempted! Correct answer: ${item.answer}</span>`;
        }
    });
    
    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";
    resultDiv.innerHTML = `<h3>Test Results</h3>
                          <p>Total Questions: ${masterQuestions.length}</p>
                          <p>Attempted: ${attempted}</p>
                          <p>Score: <b>${score} / ${masterQuestions.length}</b></p>`;
                          
    if (score === masterQuestions.length) {
